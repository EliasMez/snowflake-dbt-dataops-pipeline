[project]
name = "nyc-taxi-snowflake-dbt"
version = "0.1.0"
description = ""
authors = [
    {name = "EliasMez",email = "elias.mezine@laposte.net"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "snowflake-connector-python (==3.17.4)",
    "python-dotenv (==1.2.1)",
    "curl-cffi (==0.13.0)",
    "lxml (==6.0.2)",
    "requests (==2.32.5)",
    "dbt-snowflake (==1.10.3)",
    "dbt-core (==1.10.13)",
    "opentelemetry-api (==1.38.0)",
    "opentelemetry-sdk (==1.38.0)",
    "opentelemetry-semantic-conventions (==0.59b0)",
    "urllib3 (==2.6.0)"
]


[build-system]
requires = ["uv_build>=0.8.0,<0.10.0"]
build-backend = "uv_build"





[dependency-groups]
test = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)"
]
docs = [
    "mkdocs (==1.6.1)",
    "mkdocs-material (==9.5.49)",
    "mkdocstrings (==0.27.0)",
    "mkdocstrings-python (==1.12.2)",
    "mkdocs-static-i18n (==1.3.0)",
    "mkdocs-git-revision-date-localized-plugin (==1.3.0)",
    "mkdocs-macros-plugin (==1.3.7)",
    "pymdown-extensions (==10.14.3)",
    "dbt-core (==1.10.13)",
    "dbt-snowflake (==1.10.3)"
]
sqlfluff = [
    "sqlfluff (==3.5.0)",
    "sqlfluff-templater-dbt (==3.5.0)",
    "chardet (==5.2.0)"
]
release = [
    "python-semantic-release (==10.7.0)"
]

[tool.uv.build-backend]
module-root = ""
module-name = "snowflake_ingestion"